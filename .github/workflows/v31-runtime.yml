name: Duyen Dich v3.1 runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  v31-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run v3.1 boundary regression
        run: python -m unittest -v test_v31_runtime.py
